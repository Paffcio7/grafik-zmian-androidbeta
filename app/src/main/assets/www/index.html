<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f5f7fb"><title>Twój grafik</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#102033;--muted:#75839a;--line:#e8edf4;--blue:#3478f6;--day:#ff9f1c;--night:#6757d9;--shadow:0 8px 28px #24364d12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}.dark{--bg:#071522;--card:#0d2031;--text:#f5f8fc;--muted:#91a0b2;--line:#193248;--blue:#5d96ff;--shadow:0 8px 28px #0004}.app{max-width:520px;margin:auto;padding:18px 16px 94px}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px}.title{font-weight:800;font-size:22px}.sub{font-size:12px;color:var(--muted);margin-top:2px}.iconbtn,.navbtn,.brig button,.today{border:0;background:var(--card);color:var(--text);box-shadow:var(--shadow);border-radius:14px}.iconbtn{width:42px;height:42px;font-size:18px}.brig{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:var(--card);padding:5px;border-radius:16px;box-shadow:var(--shadow);margin-bottom:14px}.brig button{box-shadow:none;padding:10px 0;font-weight:800;background:transparent}.brig button.on{background:var(--blue);color:#fff}.hero{padding:16px;border-radius:20px;background:linear-gradient(135deg,#2476f5,#568cff);color:#fff;box-shadow:0 12px 32px #3478f63d;margin-bottom:14px}.hero .small{font-size:12px;opacity:.8}.hero .big{font-size:21px;font-weight:850;margin:6px 0 2px}.hero .time{font-size:14px;opacity:.95}.monthbar{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:8px;margin:10px 0}.navbtn{height:42px;font-size:20px}.month{text-align:center;font-weight:850;font-size:18px}.week{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--muted);font-weight:750;text-align:center;padding:6px 0}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cell{aspect-ratio:.86;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:7px 5px;position:relative;box-shadow:0 2px 8px #00000008}.cell.blank{visibility:hidden}.num{font-size:12px;font-weight:750}.badge{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:27px;height:27px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:12px}.badge.d{background:var(--day)}.badge.n{background:var(--night)}.cell.todayCell{outline:2px solid var(--blue);outline-offset:1px}.legend{display:flex;gap:14px;justify-content:center;color:var(--muted);font-size:12px;margin:16px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:4px;margin-right:5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}.sheetbg{position:fixed;inset:0;background:#0007;display:grid;align-items:end;z-index:5}.sheet{background:var(--card);border-radius:24px 24px 0 0;padding:20px 20px 32px;max-width:520px;width:100%;margin:auto}.sheet h2{margin:0 0 4px}.sheet p{color:var(--muted);margin:6px 0}.close{width:100%;border:0;border-radius:15px;padding:13px;margin-top:18px;background:var(--blue);color:white;font-weight:800}.bottom{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--card) 94%,transparent);border-top:1px solid var(--line);padding:9px 16px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center}.today{height:42px;padding:0 22px;font-weight:800}.fade{opacity:.35}.entry{margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:12px}.entry textarea{width:100%;min-height:70px;border:0;background:var(--bg);color:var(--text);border-radius:10px;padding:10px;resize:none}.entry button{margin-top:8px;border:0;border-radius:10px;background:var(--blue);color:white;padding:9px 14px;font-weight:750}
</style>
</head>
<body><div id="root"></div><div id="modal"></div>
<script>
(()=>{'use strict';
const C=['D','D','O','O','N','N','N','O','O','D','D','O','O','O','N','N','O','O','D','D','D','O','O','N','N','O','O','O'],OFF={A:0,B:7,C:14,D:21},M=['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'],WD=['Pn','Wt','Śr','Cz','Pt','So','Nd'];let s=JSON.parse(localStorage.getItem('gzb')||'{"brig":"A","dark":false,"notes":{}}'),cur=new Date(new Date().getFullYear(),new Date().getMonth(),1);const root=document.querySelector('#root'),modal=document.querySelector('#modal');
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const days=(a,b)=>Math.round((Date.UTC(a.getFullYear(),a.getMonth(),a.getDate())-Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()))/864e5);const mod=(n,m)=>((n%m)+m)%m;const shift=d=>C[mod(days(d,new Date(2026,8,14))+OFF[s.brig],28)];const meta=c=>c==='D'?['Dniówka','06:00–18:00','d']:c==='N'?['Nocka','18:00–06:00','n']:['Wolne','Dzień wolny','o'];const save=()=>localStorage.setItem('gzb',JSON.stringify(s));
function render(){document.documentElement.classList.toggle('dark',s.dark);let now=new Date(),sm=meta(shift(now)),y=cur.getFullYear(),m=cur.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,last=new Date(y,m+1,0).getDate(),cells='';for(let i=0;i<first;i++)cells+='<div class="cell blank"></div>';let D=0,N=0;for(let d=1;d<=last;d++){let dt=new Date(y,m,d),c=shift(dt);if(c==='D')D++;if(c==='N')N++;let today=key(dt)===key(now)?' todayCell':'';cells+=`<button class="cell${today}" data-date="${key(dt)}"><span class="num">${d}</span>${c==='O'?'':`<span class="badge ${c.toLowerCase()}">${c}</span>`}</button>`}root.innerHTML=`<main class="app"><header class="top"><div><div class="title">Twój grafik</div><div class="sub">Środa Śląska · grafik 12-godzinny</div></div><button class="iconbtn" id="theme">${s.dark?'☀':'☾'}</button></header><div class="brig">${['A','B','C','D'].map(b=>`<button data-brig="${b}" class="${s.brig===b?'on':''}">${b}</button>`).join('')}</div><section class="hero"><div class="small">Brygada ${s.brig} · dzisiaj</div><div class="big">${sm[0]}</div><div class="time">${sm[1]}</div></section><div class="monthbar"><button class="navbtn" id="prev">‹</button><div class="month">${M[m]} ${y}</div><button class="navbtn" id="next">›</button></div><div class="week">${WD.map(x=>`<span>${x}</span>`).join('')}</div><div class="cal">${cells}</div><div class="legend"><span><i class="dot" style="background:var(--day)"></i>Dniówka</span><span><i class="dot" style="background:var(--night)"></i>Nocka</span><span>· Wolne</span></div><div class="stats"><div class="stat"><b>${D+N}</b><span>ZMIAN</span></div><div class="stat"><b>${D} / ${N}</b><span>D / N</span></div><div class="stat"><b>${(D+N)*12}</b><span>GODZIN</span></div></div></main><div class="bottom"><button class="today" id="today">Dziś</button></div>`;bind()}
function bind(){document.querySelector('#theme').onclick=()=>{s.dark=!s.dark;save();render()};document.querySelectorAll('[data-brig]').forEach(x=>x.onclick=()=>{s.brig=x.dataset.brig;save();render()});document.querySelector('#prev').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};document.querySelector('#next').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};document.querySelector('#today').onclick=()=>{let n=new Date();cur=new Date(n.getFullYear(),n.getMonth(),1);render()};document.querySelectorAll('[data-date]').forEach(x=>x.onclick=()=>open(x.dataset.date))}
function open(k){let [y,m,d]=k.split('-').map(Number),dt=new Date(y,m-1,d),mm=meta(shift(dt)),note=s.notes[k]||'';modal.innerHTML=`<div class="sheetbg" id="bg"><section class="sheet"><h2>${d} ${M[m-1]} ${y}</h2><p>Brygada ${s.brig}</p><div class="hero"><div class="small">Zaplanowana zmiana</div><div class="big">${mm[0]}</div><div class="time">${mm[1]}</div></div><div class="entry"><b>Notatka do dnia</b><textarea id="note" placeholder="Dodaj notatkę…">${note.replaceAll('&','&amp;').replaceAll('<','&lt;')}</textarea><button id="saveNote">Zapisz</button></div><button class="close" id="close">Zamknij</button></section></div>`;document.querySelector('#close').onclick=()=>modal.innerHTML='';document.querySelector('#saveNote').onclick=()=>{s.notes[k]=document.querySelector('#note').value;save();modal.innerHTML=''};document.querySelector('#bg').onclick=e=>{if(e.target.id==='bg')modal.innerHTML=''}}render();})();
</script></body></html>
