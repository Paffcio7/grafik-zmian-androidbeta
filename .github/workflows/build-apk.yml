name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore frozen v0.2.0 source
        shell: bash
        run: |
          set -euo pipefail
          cat release/v0.2.0/chunk.001 release/v0.2.0/chunk.002 release/v0.2.0/chunk.003 release/v0.2.0/chunk.004 release/v0.2.0/chunk.005 release/v0.2.0/chunk.006 release/v0.2.0/chunk.007 > /tmp/v020.b64
          base64 --decode /tmp/v020.b64 > /tmp/v020.tar.gz
          echo "21b17f21cd7550c79ec69ae708a095a304fa76c345840cee86823f37e2c41a41  /tmp/v020.tar.gz" | sha256sum -c -
          rm -rf app build.gradle settings.gradle README.md VALIDATION.md
          tar -xzf /tmp/v020.tar.gz -C .

      - name: Apply v0.2.1 compact UI hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 hotfix/v0.2.1/apply.py
          grep -q "versionCode 6" app/build.gradle
          grep -q "versionName '0.2.1'" app/build.gradle
          grep -q 'for(let i=0;i<42;i++)' app/src/main/assets/www/app.js
          ! grep -q 'for(let i=0;i<49;i++)' app/src/main/assets/www/app.js
          node --check app/src/main/assets/www/app.js

      - name: Apply v0.2.2 swipe animation hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 hotfix/v0.2.2/apply.py
          grep -q "versionCode 7" app/build.gradle
          grep -q "versionName '0.2.2'" app/build.gradle
          grep -q 'bindMonthSwipe' app/src/main/assets/www/app.js
          grep -q 'pointermove' app/src/main/assets/www/app.js
          grep -q 'for(let i=0;i<42;i++)' app/src/main/assets/www/app.js
          node --check app/src/main/assets/www/app.js

      - name: Apply v0.2.3 live adjacent month carousel
        shell: bash
        run: |
          set -euo pipefail
          python3 hotfix/v0.2.3/apply.py
          grep -q "versionCode 8" app/build.gradle
          grep -q "versionName '0.2.3'" app/build.gradle
          grep -q 'monthPanel' app/src/main/assets/www/app.js
          grep -q 'calendar-viewport' app/src/main/assets/www/app.js
          grep -q 'calendar-track' app/src/main/assets/www/app.js
          grep -q "monthPanel(prev,'prev')" app/src/main/assets/www/app.js
          grep -q "monthPanel(next,'next')" app/src/main/assets/www/app.js
          grep -q 'setTrackDrag' app/src/main/assets/www/app.js
          grep -q 'Kalendarz zmian · v0.2.3' app/src/main/assets/www/app.js
          grep -q 'v0.2.3 live adjacent-month carousel' app/src/main/assets/www/styles.css
          grep -q 'width:300%' app/src/main/assets/www/styles.css
          grep -q 'translate3d(-33.333333%,0,0)' app/src/main/assets/www/styles.css
          grep -q 'for(let i=0;i<42;i++)' app/src/main/assets/www/app.js
          grep -q -- '--day:#ff9f1c' app/src/main/assets/www/styles.css
          grep -q -- '--night:#111111' app/src/main/assets/www/styles.css
          grep -q 'openDayEditor' app/src/main/java/pl/grafikzmian/app/MainActivity.java
          grep -q 'class DayEditorActivity' app/src/main/java/pl/grafikzmian/app/DayEditorActivity.java
          node --check app/src/main/assets/www/app.js
          python3 -m py_compile hotfix/v0.2.3/apply.py
          python3 - <<'PY'
          from datetime import date
          cycle=['D','D','O','O','N','N','N','O','O','D','D','O','O','O','N','N','O','O','D','D','D','O','O','N','N','O','O','O']
          anchor=date(2026,9,14)
          vals=[]
          for d in range(1,31):
              x=date(2026,9,d)
              vals.append(cycle[((x-anchor).days)%28])
          assert vals.count('D')==7, vals
          assert vals.count('N')==8, vals
          print('SCHEDULE_A_SEP_2026_PASS D=7 N=8')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build v0.2.3 debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: KalendarzZmian-v0.2.3-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
