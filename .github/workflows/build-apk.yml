name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore frozen v0.1.1 source
        shell: bash
        run: |
          cat hotfix/v0.1.1/payload.001 hotfix/v0.1.1/payload.002 hotfix/v0.1.1/payload.003 hotfix/v0.1.1/payload.004 > /tmp/hotfix.b64
          base64 --decode /tmp/hotfix.b64 > /tmp/hotfix.tar.gz
          echo "b3094cae30ff4ee94f35097ba0f9656afa995aa08aac33e6832236bce88b8d8c  /tmp/hotfix.tar.gz" | sha256sum -c -
          tar -xzf /tmp/hotfix.tar.gz -C .
      - name: Apply v0.1.2 interaction hotfix
        shell: bash
        run: |
          python3 hotfix/v0.1.2/apply.py
          grep -q "versionCode 3" app/build.gradle
          grep -q "versionName '0.1.2'" app/build.gradle
          grep -q 'type="radio"' app/src/main/assets/www/app.js
          grep -q 'id="entry-note"' app/src/main/assets/www/app.js
          grep -q 'setFocusableInTouchMode(true)' app/src/main/java/pl/grafikzmian/app/MainActivity.java
          grep -q 'setOnApplyWindowInsetsListener' app/src/main/java/pl/grafikzmian/app/MainActivity.java
          grep -q 'android.hardware.biometrics.BiometricPrompt' app/src/main/java/pl/grafikzmian/app/MainActivity.java
          grep -q 'android:windowSoftInputMode="adjustResize"' app/src/main/AndroidManifest.xml
          node --check app/src/main/assets/www/app.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build v0.1.2 debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GrafikZmian-v0.1.2-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
