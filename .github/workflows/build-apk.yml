name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore frozen v0.2.0 source
        shell: bash
        run: |
          set -euo pipefail
          cat release/v0.2.0/chunk.001 release/v0.2.0/chunk.002 release/v0.2.0/chunk.003 release/v0.2.0/chunk.004 release/v0.2.0/chunk.005 release/v0.2.0/chunk.006 release/v0.2.0/chunk.007 > /tmp/v020.b64
          base64 --decode /tmp/v020.b64 > /tmp/v020.tar.gz
          echo "21b17f21cd7550c79ec69ae708a095a304fa76c345840cee86823f37e2c41a41  /tmp/v020.tar.gz" | sha256sum -c -
          rm -rf app build.gradle settings.gradle README.md VALIDATION.md
          tar -xzf /tmp/v020.tar.gz -C .

      - name: Validate v0.2.0 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 5" app/build.gradle
          grep -q "versionName '0.2.0'" app/build.gradle
          grep -q 'android:label="Kalendarz zmian"' app/src/main/AndroidManifest.xml
          grep -q 'data-onboard-brigade' app/src/main/assets/www/app.js
          grep -q 'drawerOpen' app/src/main/assets/www/app.js
          grep -q 'PepsiCo, Środa Śląska' app/src/main/assets/www/app.js
          grep -q 'for(let i=0;i<49;i++)' app/src/main/assets/www/app.js
          grep -q -- '--day:#ff9f1c' app/src/main/assets/www/styles.css
          grep -q -- '--night:#111111' app/src/main/assets/www/styles.css
          grep -q 'openDayEditor' app/src/main/java/pl/grafikzmian/app/MainActivity.java
          grep -q 'setOnApplyWindowInsetsListener' app/src/main/java/pl/grafikzmian/app/MainActivity.java
          grep -q 'class DayEditorActivity' app/src/main/java/pl/grafikzmian/app/DayEditorActivity.java
          grep -q 'DayEditorActivity' app/src/main/AndroidManifest.xml
          node --check app/src/main/assets/www/app.js
          python3 - <<'PY'
          from datetime import date
          cycle=['D','D','O','O','N','N','N','O','O','D','D','O','O','O','N','N','O','O','D','D','D','O','O','N','N','O','O','O']
          anchor=date(2026,9,14)
          vals=[]
          for d in range(1,31):
              x=date(2026,9,d)
              vals.append(cycle[((x-anchor).days)%28])
          assert vals.count('D')==7, vals
          assert vals.count('N')==8, vals
          print('SCHEDULE_A_SEP_2026_PASS D=7 N=8')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build v0.2.0 debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: KalendarzZmian-v0.2.0-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
