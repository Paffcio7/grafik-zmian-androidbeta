name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore frozen v0.2.0 source
        shell: bash
        run: |
          set -euo pipefail
          cat release/v0.2.0/chunk.001 release/v0.2.0/chunk.002 release/v0.2.0/chunk.003 release/v0.2.0/chunk.004 release/v0.2.0/chunk.005 release/v0.2.0/chunk.006 release/v0.2.0/chunk.007 > /tmp/v020.b64
          base64 --decode /tmp/v020.b64 > /tmp/v020.tar.gz
          echo "21b17f21cd7550c79ec69ae708a095a304fa76c345840cee86823f37e2c41a41  /tmp/v020.tar.gz" | sha256sum -c -
          rm -rf app build.gradle settings.gradle README.md VALIDATION.md
          tar -xzf /tmp/v020.tar.gz -C .

      - name: Apply v0.2.1 compact UI hotfix
        run: |
          set -euo pipefail
          python3 hotfix/v0.2.1/apply.py

      - name: Apply v0.2.2 swipe animation hotfix
        run: |
          set -euo pipefail
          python3 hotfix/v0.2.2/apply.py

      - name: Apply v0.2.3 live adjacent month carousel
        run: |
          set -euo pipefail
          python3 hotfix/v0.2.3/apply.py

      - name: Apply v0.2.4 current day highlight
        run: |
          set -euo pipefail
          python3 hotfix/v0.2.4/apply.py

      - name: Apply v0.2.5 soft yellow today highlight
        run: |
          set -euo pipefail
          python3 hotfix/v0.2.5/apply.py

      - name: Apply v0.2.6 brigade and date picker fix
        run: |
          set -euo pipefail
          python3 hotfix/v0.2.6/apply.py

      - name: Apply v0.2.7 status bar and theme selector
        shell: bash
        run: |
          set -euo pipefail
          python3 hotfix/v0.2.7/apply.py
          grep -q "versionCode 12" app/build.gradle
          grep -q "versionName '0.2.7'" app/build.gradle
          grep -q "theme:'system'" app/src/main/assets/www/app.js
          grep -q 'data-theme-settings' app/src/main/assets/www/app.js
          grep -q 'function themeSheet' app/src/main/assets/www/app.js
          grep -q 'function resolvedDark' app/src/main/assets/www/app.js
          grep -q 'Kalendarz zmian · v0.2.7' app/src/main/assets/www/app.js
          grep -q 'v0.2.7 visible system bars + full theme selector' app/src/main/assets/www/styles.css
          grep -q 'html\[data-theme="dark"\]' app/src/main/assets/www/styles.css
          grep -q 'FLAG_FULLSCREEN' app/src/main/java/pl/grafikzmian/app/MainActivity.java
          grep -q 'controller.show' app/src/main/java/pl/grafikzmian/app/MainActivity.java
          grep -q 'APPEARANCE_LIGHT_NAVIGATION_BARS' app/src/main/java/pl/grafikzmian/app/MainActivity.java
          grep -q 'BRIGADE_OFFSET={A:0,B:14,C:7,D:21}' app/src/main/assets/www/app.js
          grep -q 'data-open-date-picker' app/src/main/assets/www/app.js
          grep -q 'for(let i=0;i<42;i++)' app/src/main/assets/www/app.js
          node --check app/src/main/assets/www/app.js
          python3 -m py_compile hotfix/v0.2.7/apply.py

      - name: Apply v0.2.8 readable status bar icons
        shell: bash
        run: |
          set -euo pipefail
          python3 hotfix/v0.2.8/apply.py
          grep -q "versionCode 13" app/build.gradle
          grep -q "versionName '0.2.8'" app/build.gradle
          grep -q 'dark ? "#0B1118" : "#F4F7FA"' app/src/main/java/pl/grafikzmian/app/MainActivity.java
          grep -q 'if(!dark) flags |= android.view.View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR' app/src/main/java/pl/grafikzmian/app/MainActivity.java
          grep -q 'APPEARANCE_LIGHT_STATUS_BARS' app/src/main/java/pl/grafikzmian/app/MainActivity.java
          grep -q 'Kalendarz zmian · v0.2.8' app/src/main/assets/www/app.js
          grep -q "theme:'system'" app/src/main/assets/www/app.js
          grep -q 'data-theme-settings' app/src/main/assets/www/app.js
          grep -q 'BRIGADE_OFFSET={A:0,B:14,C:7,D:21}' app/src/main/assets/www/app.js
          grep -q 'data-open-date-picker' app/src/main/assets/www/app.js
          grep -q 'for(let i=0;i<42;i++)' app/src/main/assets/www/app.js
          node --check app/src/main/assets/www/app.js
          python3 -m py_compile hotfix/v0.2.8/apply.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build v0.2.8 debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: KalendarzZmian-v0.2.8-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
